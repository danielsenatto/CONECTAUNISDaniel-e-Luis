/* Refinamentos Conecta UNIS */
.brand-mark-logo{border-radius:50%;width:40px;height:40px;background:linear-gradient(145deg,#082c68 0 49%,#ffcf40 49% 72%,#082c68 72%);position:relative;box-shadow:0 5px 16px #12377830;overflow:hidden}
.brand-mark-logo span{font-size:20px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#ffcf40;text-shadow:0 1px 1px #07204d;transform:scaleX(1.08)}
.login-visual:before{background:linear-gradient(0deg,#091b49ed,rgba(9,27,73,.45) 55%,rgba(9,27,73,.22)),var(--auth-photo) center/cover;opacity:.95}
.auth-photo-overlay{position:absolute!important;inset:0;background:linear-gradient(130deg,#153d91a8,#061638b8);pointer-events:none}
.login-visual .brand,.login-visual h1,.login-visual>p,.login-visual .benefits,.login-visual .login-footer{z-index:1}
.icon-btn-modern{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f2f5fc;border:1px solid #e1e8f6}
.icon-btn-modern:hover{background:#e7edff;color:var(--blue)}
.icon-btn-modern svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feed-layout{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
.feed-compose,.feed-post,.feed-side-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px #19356d08}
.feed-compose{padding:20px;margin-bottom:18px}
.feed-compose-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.feed-compose textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:13px;outline:none;background:#fafcff}
.feed-compose-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.feed-post{padding:22px;margin-bottom:18px;overflow:hidden}
.feed-author{display:flex;gap:12px;align-items:center}
.feed-author .avatar{width:44px;height:44px;flex:0 0 44px}
.feed-author strong{display:block;font-size:13px}
.feed-author small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.feed-post-text{font-size:14px;line-height:1.75;margin:18px 0;color:#283853;white-space:pre-wrap}
.feed-photo{width:100%;max-height:430px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.feed-job-box{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(135deg,#f8faff,#edf3ff);display:flex;justify-content:space-between;align-items:center;gap:15px}
.feed-post-stats{font-size:11px;color:var(--muted);padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.feed-post-actions{display:flex;gap:8px;padding-top:12px}
.feed-post-actions button{flex:1;border:0;background:#f4f7fd;border-radius:10px;padding:11px;color:#51617d;font-weight:700;font-size:12px}
.feed-post-actions button.liked{background:#e8efff;color:var(--blue)}
.feed-side-card{padding:20px;margin-bottom:16px}
.feed-side-card h3{margin:0 0 12px;font-size:14px}
.feed-side-card p{color:var(--muted);font-size:12px;line-height:1.7}
.profile-preview-hero{text-align:center;padding:34px 22px}
.profile-preview-avatar{height:92px;width:92px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#2046b3,#0b929b);color:#fff;font-size:27px;font-weight:800;overflow:hidden}
.profile-preview-avatar img{width:100%;height:100%;object-fit:cover}
.profile-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:900px){.feed-layout{grid-template-columns:1fr}.feed-sidebar{display:none}.articles{grid-template-columns:1fr}.article-card{min-height:230px;padding:24px}}
@media(max-width:620px){.profile-preview-grid{grid-template-columns:1fr}.feed-post{padding:16px}.feed-compose{padding:15px}}

function renderCareer(){return `<section class="career-hero"><h1>Orientações de Carreira</h1><p>Conteúdo exclusivo para ajudar alunos da UNIS a conquistarem seu espaço no mercado de trabalho com confiança e preparo.</p></section><div class="articles">${articles.map((a,i)=>`<article class="article-card"><div class="article-icon">${a.icon}</div><div style="margin-bottom:10px">${tag(a.tag)}</div><h3>${a.title}</h3><p>${a.desc}</p><div class="article-bottom"><span>◷ ${a.time}</span><button class="text-link" onclick="openArticle(${i})">Ler artigo →</button></div></article>`).join('')}</div>`}
function openArticle(i){let a=articles[i];document.querySelector('.article-overlay')?.remove();const root=document.createElement('div');root.className='article-overlay';root.innerHTML=`<div class="article-modal" role="dialog" aria-modal="true" aria-label="${esc(a.title)}"><button class="article-close" aria-label="Fechar artigo" onclick="this.closest('.article-overlay').remove()">×</button><div class="article-modal-icon">${a.icon}</div><span class="tag">${esc(a.tag)}</span><h2>${esc(a.title)}</h2><div class="article-reading-time">Leitura de ${esc(a.time)}</div><div class="article-modal-rule"></div><p>${esc(a.body)}</p><p>Uma boa estratégia é transformar essas orientações em pequenas ações práticas. Escolha um próximo passo, coloque-o em prática e acompanhe sua evolução. Consistência vale mais do que tentar fazer tudo de uma vez.</p><button class="btn" onclick="this.closest('.article-overlay').remove()">Concluir leitura</button></div>`;root.addEventListener('click',e=>{if(e.target===root)root.remove()});document.body.appendChild(root);requestAnimationFrame(()=>root.classList.add('open'));const onKey=e=>{if(e.key==='Escape'){root.remove();document.removeEventListener('keydown',onKey)}};document.addEventListener('keydown',onKey)}
function notificationPreview(){const items=state.role==='company'?[{icon:'✉',title:'Mariana Oliveira enviou uma mensagem sobre a vaga de Designer Júnior',time:'há 10 min'},{icon:'♟',title:'Lucas tem interesse em sua vaga de Desenvolvedor Júnior',time:'há 1h'},{icon:'▣',title:'Sua vaga de Designer Júnior recebeu novas visualizações',time:'ontem'}]:[{icon:'🔔',title:'Nova vaga compatível com ADS publicada',time:'há 2h'},{icon:'◉',title:'Tech Solutions visualizou seu perfil',time:'há 5h'},{icon:'🗓️',title:'Convite para entrevista — Tech Solutions',time:'ontem'}];return `<div style="display:grid;gap:12px">${items.map(n=>`<div style="display:flex;gap:10px;align-items:center"><span class="stat-icon" style="width:34px;height:34px;font-size:15px">${n.icon}</span><div style="font-size:11px">${n.title}<div style="color:var(--muted);margin-top:3px">${n.time}</div></div></div>`).join('')}</div>`}
function renderNotifications(){const notes=state.role==='company'?[{icon:'✉',title:'Nova mensagem de Mariana Oliveira',desc:'Mariana, estudante de Design Gráfico do 6º semestre, perguntou sobre a vaga de Designer Júnior e as etapas do processo seletivo.',time:'Hoje, 10:32',action:'Responder mensagem',color:'#e1edff',fn:"go('messages')",unread:true},{icon:'♟',title:'Lucas tem interesse em sua vaga',desc:'Lucas Almeida, estudante de Análise e Desenvolvimento de Sistemas, demonstrou interesse na vaga de Desenvolvedor Júnior publicada pela sua empresa. Acesse as mensagens para conversar com ele.',time:'Hoje, 09:15',action:'Ver mensagens',color:'#f2eaff',fn:"go('messages')",unread:true},{icon:'▣',title:'Sua vaga recebeu novas visualizações',desc:'A vaga de Designer Júnior está sendo visualizada por estudantes da comunidade UNIS.',time:'Ontem, 16:45',color:'#dcfaeb',unread:true},{icon:'📋',title:'Lembrete: acompanhe seus candidatos',desc:'Confira as conversas e os perfis dos estudantes interessados para dar continuidade ao processo seletivo.',time:'Ontem, 09:00',color:'#fff5bf'},{icon:'✓',title:'Perfil da empresa atualizado',desc:'As informações da sua empresa estão disponíveis no perfil de recrutamento. Mantenha os dados e as oportunidades atualizados.',time:'25/09/2026',color:'#e1edff'}]:[{icon:'🗓️',title:'Convite para entrevista',desc:'Tech Solutions convidou você para uma entrevista para a vaga de Estágio em Desenvolvimento de Sistemas. Data sugerida: 30/09/2024 às 14h.',time:'Hoje, 10:32',action:'Confirmar entrevista',color:'#dcfaeb',fn:"toast('Confirmação registrada! A empresa receberá sua resposta.')",unread:true},{icon:'💼',title:'Nova vaga compatível com seu perfil',desc:'A empresa Inova Digital publicou uma nova vaga de Desenvolvedor Web Júnior (Remoto) que combina com seu curso de ADS e suas habilidades em React e JavaScript.',time:'Hoje, 08:15',action:'Ver vaga',color:'#e1edff',fn:"go('jobs')",unread:true},{icon:'◉',title:'Empresa visualizou sua candidatura',desc:'O recrutador da Tech Solutions visualizou seu currículo e perfil completo. Seu perfil está se destacando!',time:'Ontem, 16:45',color:'#f2eaff',unread:true},{icon:'🔄',title:'Atualização no processo seletivo',desc:'Sua candidatura para Desenvolvedor Web Júnior na Inova Digital avançou para a etapa de análise de currículo. Você receberá uma resposta em até 5 dias úteis.',time:'Ontem, 09:00',color:'#fff5bf'},{icon:'💼',title:'Nova oportunidade relacionada ao seu curso',desc:'Estão disponíveis novas vagas de estágio em Tecnologia da Informação em Varginha e região. Confira antes que as vagas fechem!',time:'25/09/2024',color:'#e1edff'}];const unread=notes.filter(n=>n.unread).length;return `<div class="section-head" style="max-width:900px;margin:0 auto 20px"><div><h2>Notificações</h2><p style="font-size:12px;color:var(--muted);margin:5px 0"> ${state.notificationsRead?'Todas as notificações foram lidas':`${unread} notificações não lidas`}</p></div><button class="btn btn-outline" onclick="state.notificationsRead=true;render()">Marcar todas como lidas</button></div><div class="notification-list">${notes.map(n=>`<article class="notification ${n.unread&&!state.notificationsRead?'unread':''}"><div class="stat-icon" style="background:${n.color}">${n.icon}</div><div style="flex:1"><h3>${n.title} ${n.unread&&!state.notificationsRead?'<span style="color:#16a34a">●</span>':''}</h3><p>${n.desc}</p><time>${n.time}</time>${n.action?`<br><button class="small-btn" onclick="${n.fn}">${n.action} →</button>`:''}</div></article>`).join('')}</div>`}
function renderMessages(){const chats=currentConversations();const msgs=currentMessages();return `<div class="section-head" style="margin-top:0"><div><h2>Mensagens</h2><p style="font-size:12px;color:var(--muted);margin:5px 0">${state.role==='company'?'Converse com estudantes interessados nas oportunidades da sua empresa.':'Converse com empresas sobre suas candidaturas e oportunidades.'}</p></div></div><section class="panel messages-layout"><aside class="conversation-list"><div class="conversation-search"><input placeholder="⌕  Buscar ${state.role==='company'?'alunos':'conversas'}..." oninput="filterConversations(this.value)"></div><div id="conversation-items">${chats.map((c,i)=>`<div class="conversation ${state.activeConversation===i?'active':''}" onclick="selectConversation(${i})">${logo(c.initials,c.color)}<div><strong>${c.name}</strong><small>${c.preview}</small></div></div>`).join('')}</div></aside><section class="chat"><div class="chat-head">${logo(chats[state.activeConversation].initials,chats[state.activeConversation].color)}<div><strong>${chats[state.activeConversation].name}</strong><small>● Online</small></div></div><div class="chat-body" id="chat-body">${(msgs[state.activeConversation]||[]).map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<time>${m.time}</time></div>`).join('')}</div><form class="chat-compose" onsubmit="sendMessage(event)"><input id="message-input" placeholder="${state.role==='company'?'Responder ao estudante...':'Digite sua mensagem...'}" autocomplete="off"><button class="btn" type="submit" aria-label="Enviar mensagem">➤</button></form></section></section>`}
function selectConversation(i){state.activeConversation=i;render()}
function filterConversations(q){const chats=currentConversations();document.querySelectorAll('.conversation').forEach((el,i)=>el.style.display=chats[i].name.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function sendMessage(e){e.preventDefault();let input=document.getElementById('message-input');let val=input.value.trim();if(!val)return;const msgs=currentMessages();msgs[state.activeConversation] ||= [];msgs[state.activeConversation].push({mine:true,text:val,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});render();setTimeout(()=>{let b=document.getElementById('chat-body');if(b)b.scrollTop=b.scrollHeight},30)}
function saveProfile(){state.profilePhoto=document.getElementById('edit-photo')?.value||'';state.bio=document.getElementById('edit-bio')?.value||'';state.skills=document.getElementById('edit-skills')?.value||'';state.experience=document.getElementById('edit-experience')?.value||'';state.profileCompletion=Math.min(100,state.profileCompletion+7);toast('Perfil atualizado!');render()}
function toggleEdit(){document.getElementById('edit-panel')?.scrollIntoView({behavior:'smooth',block:'center'});toast('Edite as informações abaixo e salve as alterações.')}
const demoStudents=[{name:'Mariana Oliveira',course:'Design Gráfico',semester:'6º semestre',city:'Varginha, MG',skills:'Figma, Photoshop, identidade visual',initials:'MO',color:'#6d28d9'},{name:'Pedro Henrique',course:'Análise e Desenvolvimento de Sistemas',semester:'5º semestre',city:'São Lourenço, MG',skills:'JavaScript, React, HTML e CSS',initials:'PH',color:'#2046b3'},{name:'Ana Clara Mendes',course:'Administração',semester:'4º semestre',city:'Varginha, MG',skills:'Excel, atendimento, organização',initials:'AC',color:'#079c8b'},{name:'Rafael Costa',course:'Análise e Desenvolvimento de Sistemas',semester:'3º semestre',city:'Três Corações, MG',skills:'Python, SQL, lógica de programação',initials:'RC',color:'#c56a00'}];
function renderCompanyHome(){const posted=state.companyJobs||[];return `<section class="hero"><div class="eyebrow">Área de recrutamento · Grupo UNIS</div><h1>Encontre talentos para sua equipe</h1><p>Conecte sua empresa aos estudantes da UNIS, divulgue oportunidades e acompanhe os candidatos em um só lugar.</p><div class="hero-actions"><button class="btn btn-light" onclick="go('companyJobs')">+ Publicar uma vaga</button><button class="btn btn-ghost" onclick="go('students')">Encontrar estudantes</button></div></section><section class="stats"><div class="stat"><div class="stat-icon">▣</div><div><strong>${posted.length}</strong><small>Vagas publicadas</small></div></div><div class="stat"><div class="stat-icon">♟</div><div><strong>${Math.max(12,posted.length*3)}</strong><small>Perfis para explorar</small></div></div><div class="stat"><div class="stat-icon">◉</div><div><strong>${posted.length*4+8}</strong><small>Visualizações de vagas</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><strong>${posted.length*2+3}</strong><small>Candidaturas recebidas</small></div></div></section><div class="section-head"><h2>Ações rápidas</h2></div><div class="articles"><article class="article-card"><div class="article-icon">♟</div><h3>Encontrar talentos</h3><p>Explore perfis demonstrativos de estudantes por curso, habilidades e cidade.</p><button class="btn" onclick="go('students')">Ver estudantes</button></article><article class="article-card"><div class="article-icon">▣</div><h3>Divulgar oportunidade</h3><p>Cadastre uma vaga com cargo, modalidade, tipo de contrato e descrição.</p><button class="btn" onclick="go('companyJobs')">Criar vaga</button></article></div><div class="section-head"><h2>Vagas recentes da sua empresa</h2><button class="text-link" onclick="go('companyJobs')">Gerenciar vagas →</button></div>${posted.length?`<div class="job-list">${posted.slice().reverse().map((j,i)=>`<article class="job-card">${logo((j.title||'V').slice(0,2).toUpperCase(),'#2046b3')}<div class="job-info"><h3>${esc(j.title)}</h3><p>${esc(j.area)} · ${esc(j.city)} · ${esc(j.type)}</p><p class="job-description">${esc(j.desc)}</p></div><span class="tag green">Publicada</span></article>`).join('')}</div>`:`<div class="panel"><p style="color:var(--muted);margin:0">Você ainda não publicou vagas. Crie a primeira oportunidade para começar a receber candidatos.</p></div>`}`}
function renderStudents(){const q=(state.search||'').toLowerCase();const list=demoStudents.filter(x=>`${x.name} ${x.course} ${x.city} ${x.skills}`.toLowerCase().includes(q));return `<div class="section-head" style="margin-top:0"><div><h2>Encontrar talentos</h2><p style="color:var(--muted);font-size:12px">Explore perfis demonstrativos de estudantes da comunidade UNIS.</p></div></div><div class="field"><input value="${esc(state.search)}" placeholder="Buscar por nome, curso, habilidade ou cidade..." oninput="state.search=this.value;renderStudentsOnly()"></div><div id="student-results" class="articles">${studentCards(list)}</div>`}
function studentCards(list){return list.map(x=>`<article class="article-card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">${logo(x.initials,x.color)}<div><h3 style="margin:0 0 4px">${esc(x.name)}</h3><p style="margin:0;color:var(--muted)">${esc(x.course)} · ${esc(x.semester)}</p></div></div><p><b>Localização:</b> ${esc(x.city)}</p><p><b>Habilidades:</b> ${esc(x.skills)}</p><button class="btn" onclick="toast('Perfil demonstrativo selecionado. Em uma versão conectada, você poderá entrar em contato com o estudante.')">Ver perfil / entrar em contato</button></article>`).join('')||'<div class="panel">Nenhum perfil encontrado. Tente outra busca.</div>'}
function renderStudentsOnly(){const el=document.getElementById('student-results');if(el){const q=(state.search||'').toLowerCase();el.innerHTML=studentCards(demoStudents.filter(x=>`${x.name} ${x.course} ${x.city} ${x.skills}`.toLowerCase().includes(q)))}}
function renderCompanyJobs(){const posted=state.companyJobs||[];return `<div class="section-head" style="margin-top:0"><div><h2>Vagas da empresa</h2><p style="color:var(--muted);font-size:12px">Publique oportunidades e gerencie suas vagas demonstrativas.</p></div></div><section class="panel"><h3 style="margin-top:0">Publicar nova vaga</h3><form onsubmit="publishCompanyJob(event)"><div class="two-col"><div class="field"><label>Nome do cargo</label><input id="company-job-title" required placeholder="Ex.: Estágio em Marketing"></div><div class="field"><label>Área profissional</label><select id="company-job-area"><option>Tecnologia</option><option>Design</option><option>Marketing</option><option>Administração</option><option>Engenharia</option><option>Saúde</option><option>Atendimento</option></select></div><div class="field"><label>Tipo de oportunidade</label><select id="company-job-type"><option>Estágio</option><option>CLT</option><option>Jovem Aprendiz</option><option>Freelancer</option><option>Temporário</option></select></div><div class="field"><label>Modalidade</label><select id="company-job-mode"><option>Híbrido</option><option>Presencial</option><option>Remoto</option></select></div><div class="field"><label>Cidade</label><input id="company-job-city" required placeholder="Ex.: Varginha, MG"></div><div class="field"><label>Remuneração</label><input id="company-job-pay" placeholder="Ex.: R$ 1.500 + benefícios"></div></div><div class="field"><label>Descrição e requisitos</label><textarea id="company-job-desc" required rows="4" placeholder="Descreva as atividades, requisitos e benefícios da vaga..."></textarea></div><button class="btn" type="submit">Publicar vaga</button><p style="font-size:11px;color:var(--muted);margin-bottom:0">Protótipo demonstrativo: a publicação fica disponível nesta sessão e não é enviada para um servidor.</p></form></section><div class="section-head"><h2>Vagas publicadas (${posted.length})</h2></div>${posted.length?`<div class="job-list">${posted.slice().reverse().map(j=>`<article class="job-card">${logo((j.title||'V').slice(0,2).toUpperCase(),'#2046b3')}<div class="job-info"><h3>${esc(j.title)}</h3><p>${esc(j.area)} · ${esc(j.city)} · ${esc(j.mode)} · ${esc(j.type)}</p><p class="job-description">${esc(j.desc)}</p><div class="job-meta"><span>${esc(j.pay||'Remuneração a combinar')}</span></div></div><span class="tag green">Publicada</span></article>`).join('')}</div>`:`<div class="panel"><p style="margin:0;color:var(--muted)">Nenhuma vaga publicada ainda.</p></div>`}`}
function publishCompanyJob(e){e.preventDefault();const title=document.getElementById('company-job-title').value.trim();if(!title)return;state.companyJobs.push({title,area:document.getElementById('company-job-area').value,type:document.getElementById('company-job-type').value,mode:document.getElementById('company-job-mode').value,city:document.getElementById('company-job-city').value.trim(),pay:document.getElementById('company-job-pay').value.trim(),desc:document.getElementById('company-job-desc').value.trim()});toast('Vaga publicada no protótipo!');render()}

div>`:''}${!signup&&!forgot?`<button class="auth-link" type="button" onclick="state.authView='forgot';render()">Esqueci minha senha</button>`:''}<button class="btn" type="submit">${signup?'Criar conta':forgot?'Enviar instruções':'Entrar'}</button>${!forgot?`<div class="auth-divider">ou</div><div class="auth-bottom">${signup?'Já tem uma conta?':'Ainda não tem uma conta?'} <button type="button" onclick="state.authView='${signup?'login':'signup'}';render()">${signup?'Entrar':'Criar conta'}</button></div>`:''}<p class="auth-extra" style="margin-top:22px">Protótipo demonstrativo: os dados ficam nesta sessão e não são enviados a um servidor.</p></form></section></main>`}
function authSubmit(e){e.preventDefault();if(state.authView==='forgot'){toast('Se o e-mail estiver cadastrado, as instruções serão enviadas.');state.authView='login';render();return}state.role=state.authMode==='company'?'company':'student';if(state.authView==='signup'){let name=document.getElementById('auth-name')?.value.trim();if(name)state.name=name;state.email=document.getElementById('auth-email').value;if(state.role==='company'){state.companyName=name||'Empresa parceira';state.name=state.companyName;state.city=document.getElementById('auth-city')?.value||state.city;toast('Conta empresarial demonstrativa criada! Configure suas vagas.')}else{state.course=document.getElementById('auth-course')?.value||state.course;state.semester=document.getElementById('auth-semester')?.value||state.semester;state.city=document.getElementById('auth-city')?.value||state.city;state.phone=document.getElementById('auth-phone')?.value||state.phone;state.profileCompletion=45;toast('Conta de estudante demonstrativa criada! Complete seu perfil.')}}else{state.email=document.getElementById('auth-email').value;if(state.role==='company'){state.companyName=state.email.split('@')[1]?.split('.')[0]?.replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())||'Empresa parceira';state.name=state.companyName;toast('Acesso empresarial demonstrativo realizado!')}else{const emailName=(state.email.split('@')[0]||'').replace(/[._-]+/g,' ').replace(/\d+/g,' ').trim().split(/\s+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');if(emailName)state.name=emailName;toast('Login demonstrativo realizado!')}}go('home')}

function renderFeed(){
 const posts=state.feedPosts||[];
 return `<section class="hero"><div class="eyebrow">Comunidade UNIS</div><h1>Feed Conecta</h1><p>Compartilhe conquistas, projetos, fotos, vídeos e oportunidades com estudantes e empresas.</p></section>
 <div class="feed-layout"><div class="feed-main">
 <form class="feed-compose" onsubmit="publishPost(event)"><div class="feed-compose-head"><div class="avatar">${esc((state.name||'D').split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><strong>Compartilhe com a comunidade</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">Sua próxima oportunidade pode começar aqui.</div></div></div>
 <textarea id="feed-text" placeholder="No que você está trabalhando? Compartilhe uma ideia, conquista ou oportunidade..."></textarea>
 <div class="feed-compose-actions"><label style="font-size:12px;color:var(--muted)">Tipo de publicação <select id="feed-kind" style="margin-left:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff"><option value="text">Publicação</option><option value="photo">Foto (URL)</option><option value="video">Vídeo (URL)</option><option value="job">Vaga / oportunidade</option></select></label><input id="feed-media" placeholder="URL da imagem/vídeo (opcional)" style="flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:10px"><button class="btn" type="submit">Publicar</button></div></form>
 ${posts.map((p,i)=>`<article class="feed-post"><div class="feed-author"><div class="avatar feed-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="Foto de ${esc(p.author)}" onerror="this.style.display='none';this.parentElement.textContent='${esc(p.author.split(' ').map(x=>x[0]).slice(0,2).join(''))}'">`:esc(p.author.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div style="flex:1"><strong>${esc(p.author)}</strong><small>${esc(p.role)} · ${esc(p.time)}</small></div><button class="text-link" onclick="toast('Opções da publicação')">•••</button></div><div class="feed-post-text">${esc(p.text)}</div>${p.kind==='photo'&&p.image?`<img class="feed-photo" src="${esc(p.image)}" alt="Imagem da publicação">`:''}${p.kind==='video'&&p.image?`<video class="feed-photo" controls src="${esc(p.image)}"></video>`:''}${p.kind==='job'?`<div class="feed-job-box"><div><strong>Estágio em Desenvolvimento de Sistemas</strong><p style="margin:6px 0 0;color:var(--muted);font-size:12px">Tech Solutions · Varginha, MG · Estágio</p></div><button class="btn" onclick="go('jobs')">Ver oportunidades</button></div>`:''}<div class="feed-post-stats"><span>👍 ${(p.likes||0)+(p.liked?1:0)} curtidas</span><span>${p.comments||0} comentários</span></div><div class="feed-post-actions"><button class="${p.liked?'liked':''}" onclick="toggleLike(${i})">${p.liked?'✓ Curtido':'♡ Curtir'}</button><button onclick="toast('Comentários: recurso demonstrativo')">▢ Comentar</button><button onclick="toast('Compartilhamento demonstrativo')">↗ Compartilhar</button></div></article>`).join('')}

function publishPost(e){
 e.preventDefault();const text=document.getElementById('feed-text').value.trim();const kind=document.getElementById('feed-kind').value;const media=document.getElementById('feed-media').value.trim();if(!text){toast('Escreva algo antes de publicar.');return}
 state.feedPosts.unshift({author:state.name||'Estudante UNIS',role:(state.course||'Comunidade UNIS')+' · UNIS',avatar:'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=160&h=160&q=80',time:'Agora',text,kind,image:media,likes:0,liked:false,comments:0});toast('Publicação adicionada ao feed!');render();
}
function toggleLike(i){const post=state.feedPosts[i];post.liked=!post.liked;if(post.liked){post.likes=(post.likes||0);try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(660,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(990,ctx.currentTime+.09);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.13);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.14);osc.onended=()=>ctx.close()}}catch(e){} }render();if(post.liked){const buttons=[...document.querySelectorAll('.feed-post-actions button')];const target=buttons.find(b=>b.getAttribute('onclick')===`toggleLike(${i})`);if(target){target.classList.add('like-pop');setTimeout(()=>target.classList.remove('like-pop'),650)}}}

function addUlly(){if(document.getElementById('ully-launcher'))return;const launcher=document.createElement('button');launcher.id='ully-launcher';launcher.className='ully-launcher';launcher.innerHTML=`<img src="${ullyAvatar}" alt="Ully, assistente virtual"><span class="ully-launcher-label">Precisa de ajuda?<small>Converse com a Ully</small></span>`;launcher.onclick=toggleUlly;document.body.appendChild(launcher);const panel=document.createElement('section');panel.id='ully-panel';panel.className='ully-panel';panel.hidden=true;panel.innerHTML=`<div class="ully-head"><img src="${ullyAvatar}" alt="Ully"><div><strong>Ully</strong><small>Assistente do Conecta UNIS</small></div><button onclick="toggleUlly(false)" aria-label="Fechar chat">✕</button></div><div class="ully-body" id="ully-body"><div class="ully-msg">Oi! Eu sou a Ully. Posso te ajudar a navegar pelo Conecta UNIS, encontrar vagas ou entender as ferramentas do site.</div><div class="ully-quick"><button onclick="ullyQuick('Como encontro vagas?')">Encontrar vagas</button><button onclick="ullyQuick('Como edito meu perfil?')">Editar meu perfil</button><button onclick="ullyQuick('Como funciona o feed?')">Usar o feed</button><button onclick="ullyQuick('Quero informações sobre a UNIS')">Sobre a UNIS</button></div></div><form class="ully-input" onsubmit="ullySend(event)"><input id="ully-input" placeholder="Digite sua dúvida..." autocomplete="off"><button type="submit">Enviar</button></form>`;document.body.appendChild(panel)}
function toggleUlly(force){addUlly();const panel=document.getElementById('ully-panel');panel.hidden=force===undefined?!panel.hidden:!force;if(!panel.hidden)setTimeout(()=>document.getElementById('ully-input')?.focus(),80)}
function ullyReply(q){const t=q.toLowerCase();let answer='Posso orientar você pelas principais áreas do site. Use o menu superior para navegar ou escolha uma das opções abaixo.';let action=null;if(/vaga|emprego|estágio|estagio|buscar|pesquis/.test(t)){answer='Para encontrar oportunidades, abra “Vagas” no menu ou use a busca no topo. Digite cargo, empresa, área ou cidade e clique em “Ver vaga” para conferir os detalhes.';action=['Abrir vagas','jobs']}else if(/perfil|foto|currículo|curriculo|editar/.test(t)){answer='Em “Meu Perfil”, você pode editar suas informações, adicionar foto por URL, descrever habilidades e experiência. Depois, clique em “Visualizar meu perfil” para conferir como ficou.';action=['Abrir meu perfil','profile']}else if(/feed|publica|post|curtir|foto|vídeo|video/.test(t)){answer='No “Feed”, escreva sua publicação, escolha se é texto, foto, vídeo ou oportunidade e clique em “Publicar”. Você também pode curtir publicações de exemplo.';action=['Abrir o Feed','feed']}else if(/mensagem|conversa|chat/.test(t)){answer='Clique no ícone de mensagens no topo da tela para abrir suas conversas demonstrativas com as empresas.';action=['Abrir mensagens','messages']}else if(/notifica/.test(t)){answer='Use o sino no topo da tela para ver convites, atualizações e avisos demonstrativos.';action=['Ver notificações','notifications']}else if(/carreira|artigo|currículo|entrevista/.test(t)){answer='Na aba “Carreira”, você encontra artigos com orientações sobre currículo, entrevistas e primeiro emprego. Clique em “Ler artigo” para abrir o conteúdo.';action=['Abrir carreira','career']}else if(/unis|faculdade|curso/.test(t)){answer='Na área “Sobre a UNIS” você encontra informações gerais sobre o Grupo UNIS, exemplos de cursos, fotos e links oficiais.';action=['Conhecer a UNIS','unis']}else if(/claro|escuro|tema/.test(t)){answer='Para trocar entre modo claro e escuro, clique no ícone de sol ou lua na barra superior.'}else if(/candidatura|candidatar/.test(t)){answer='Você pode abrir uma vaga, ler os detalhes e clicar em candidatar-se. Depois acompanhe o andamento na aba “Candidaturas”.';action=['Ver candidaturas','applications']}return {answer,action}}
function ullyAppend(text,who='bot',action=null){const body=document.getElementById('ully-body');if(!body)return;const div=document.createElement('div');div.className='ully-msg'+(who==='user'?' user':'');div.textContent=text;body.appendChild(div);if(action){const b=document.createElement('button');b.className='ully-quick';b.style.cssText='border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--blue);padding:8px 12px;font-size:12px;cursor:pointer;margin:0 0 12px';b.textContent=action[0];b.onclick=()=>{go(action[1]);toggleUlly(false)};body.appendChild(b)}body.scrollTop=body.scrollHeight}
function ullyQuick(q){ullyAppend(q,'user');const r=ullyReply(q);setTimeout(()=>ullyAppend(r.answer,'bot',r.action),100)}
function ullySend(e){e.preventDefault();const input=document.getElementById('ully-input');const q=input.value.trim();if(!q)return;input.value='';ullyQuick(q)}

function render(){document.body.classList.toggle('dark',state.theme==='dark');const app=document.getElementById('app');if(state.page==='login'){app.innerHTML=renderLogin();addUlly();return}let body=state.page==='home'?(state.role==='company'?renderCompanyHome():renderHome()):state.page==='students'?renderStudents():state.page==='companyJobs'?renderCompanyJobs():state.page==='jobs'?renderJobs():state.page==='profile'?renderProfile():state.page==='applications'?renderApplications():state.page==='career'?renderCareer():state.page==='feed'?renderFeed():state.page==='profilePreview'?renderProfilePreview():state.page==='messages'?renderMessages():state.page==='notifications'?renderNotifications():state.page==='unis'?renderUnis():renderHome();app.innerHTML=nav()+`<main class="main"><div class="page">${body}</div></main>`;addUlly()}
render();
</script>
